# Host nginx in front of the catalog-search container.
# run.sh replaces __APP_PORT__ with the host port it actually bound.
# Certbot rewrites this file in /etc/nginx after the first successful run.
server {
    listen 80;
    listen [::]:80;
    server_name search.marwadihub.com;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
