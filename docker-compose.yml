services:
  app:
    build: .
    image: catalog-search:latest
    pull_policy: build
    # Host port comes from run.sh. 8080 is preferred; the next free port is used when it is taken.
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-meili-demo-master-key}
      DATA_PROFILE: ${DATA_PROFILE:-catalog}
      SEARCH_INDEX_NAME: ${SEARCH_INDEX_NAME:-catalog}
      NLP_MODE: ${NLP_MODE:-hybrid}
      GLINER_MODEL: ${GLINER_MODEL:-gliner-community/gliner_small-v2.5}
    volumes:
      - meili_data:/data
    restart: unless-stopped

volumes:
  meili_data:
